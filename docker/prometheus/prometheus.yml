#this file to tell prometheus what we will observe and from where collect its metrcis
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s


# first data about postgres
scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # because qdrant has its oen exporter so we will pass metrcis_path to ask for metrics  
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']