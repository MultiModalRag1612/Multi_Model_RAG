services:
  #fastapi application


  #Nginx service


  #postgresSQL service
  postgres:
    image: postgres:16
    container_name: postgres
    ports: 
      - "5432:5432"
    volumes:
        #this is the directory of data in docker hub 
      - postgres_data:/var/lib/postgresql/data
    # we will create environment file not write it here because it contain sensetive data 
    #so we will use env file
    env_file:
      - .env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #Qdrant(vectorDB) service
  #qdrant has its own metrcis and qdrant exporter so we will need ti build qdrant-exporter 
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

    # the path of storage in docker image  /qdrant/storage and we mapped in (qdrant_data) local docker
    #we get /qdrant/storage into qdrant_data
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always

  #prometheus service
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    ports:
      - 9090:9090"
    volumes:
      - prometheus_data:/prometheus
      #we need to pass configration file to guide promethus which metrics to mointoring it 
      #we will overwrite the default config  ==>  prometheus.yml:/etc/prometheus/prometheus.yml with our loacl config 
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always


  #Grafana Dashboard service


  #Node Exporter service to give all information about machine we deploy in it (system metrics)
  
  
  #postgresSQL Exporter for postgres metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_file:
      - .env/.env.postgres-exporter
    depends_on:
      - postgres
    networks:
      - backend    
    restart: always