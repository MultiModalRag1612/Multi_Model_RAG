services:

  #FastAPI application service
  fastapi:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile 
    container_name: fastapi
    ports:
      - "8000:8000"
    networks:
      - backend
    volumes:
      - fastapi_data:/app/assets
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    env_file:
      - ./env/.env.application
 
  

  #Nginx service
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    networks:
      - backend
    ports:
      - "80:80"
    depends_on:
      - fastapi
    volumes:
      - ./default_nginx.conf:etc//nginx/conf.d/default.conf
    restart: always

  
  #postgresSQL service
  postgres:
    image: postgres:16
    container_name: postgres
    ports: 
      - "5432:5432"
    volumes:
        #this is the directory of data in docker hub 
      - postgres_data:/var/lib/postgresql/data
    # we will create environment file not write it here because it contain sensetive data 
    #so we will use env file
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  #Qdrant(vectorDB) service
  #qdrant has its own metrcis and qdrant exporter so we will need ti build qdrant-exporter 
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

    # the path of storage in docker image  /qdrant/storage and we mapped in (qdrant_data) local docker
    #we get /qdrant/storage into qdrant_data
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always


  #prometheus service
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      #we need to pass configration file to guide promethus which metrics to mointoring it 
      #we will overwrite the default config  ==>  prometheus.yml:/etc/prometheus/prometheus.yml with our loacl config 
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"


  #Grafana Dashboard service
  grafana:
    image: grafana/grafana:11.6.0-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always


  #Node Exporter  prometheus service to give all information about machine we deploy in it (system metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($|/)'
    networks:
      - backend
    restart: always

  #postgresSQL Exporter for postgres metrics service
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      - postgres
    networks:
      - backend    
    restart: always

# at the final of docker-compose file we need to identify all networks and volumes we have 

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  fastapi_data: